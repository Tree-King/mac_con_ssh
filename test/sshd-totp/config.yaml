servers:
  local-test:
    host: "127.0.0.1"
    port: 2222
    username: "tunnel"
    auth:
      type: "password_totp"
      password: "password"
      totp_seed: "JBSWY3DPEHPK3PXP"
    forwards:
      - name: "http"
        local_host: "127.0.0.1"
