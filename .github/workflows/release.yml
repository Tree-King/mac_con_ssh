name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set release tag
        run: |
          echo "RELEASE_TAG=main-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Run tests
        run: GOTOOLCHAIN=local go test ./...
      - name: Run vet
        run: GOTOOLCHAIN=local go vet ./...
      - name: Build release artifacts
        run: make release VERSION=${RELEASE_TAG}
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Main build ${{ github.run_number }}
          body: |
            Automated build from `${{ github.sha }}` on `main`.

            The archive names and `ssh-tunnel version` output use `${{ env.RELEASE_TAG }}` so you can compare a downloaded binary with this release.

            This workflow creates a new release for each run instead of deleting or reusing an older release/tag.
          make_latest: true
          files: |
            dist/*
