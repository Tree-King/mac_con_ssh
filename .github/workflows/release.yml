name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

env:
  RELEASE_TAG: latest
  RELEASE_VERSION: latest

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: GOTOOLCHAIN=local go test ./...
      - name: Run vet
        run: GOTOOLCHAIN=local go vet ./...
      - name: Build release artifacts
        run: make release VERSION=${RELEASE_VERSION}
      - name: Delete previous latest release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const isMissing = (error) => {
              const message = String(error.response?.data?.message || error.message || '');
              return error.status === 404 || (error.status === 422 && message.includes('Reference does not exist'));
            };

            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
              });
              core.info(`Deleted existing release for ${tag}`);
            } catch (error) {
              if (!isMissing(error)) {
                throw error;
              }
              core.info(`No existing release found for ${tag}`);
            }

            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Deleted existing tag ${tag}`);
            } catch (error) {
              if (!isMissing(error)) {
                throw error;
              }
              core.info(`No existing tag found for ${tag}`);
            }
      - name: Upload latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Latest main build
          body: |
            Automated build from `${{ github.sha }}` on `main`.

            This workflow replaces the previous `${{ env.RELEASE_TAG }}` release on every push to `main`.
          make_latest: true
          files: |
            dist/*
